<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Dashboard</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "Segoe UI", sans-serif;
  color: #f5f4ef;
  background:
    radial-gradient(circle at 18% 8%, rgba(101,115,104,.28), transparent 34%),
    radial-gradient(circle at 88% 90%, rgba(98,84,72,.22), transparent 36%),
    #111513;
}

.dashboard {
  height: 100vh;
  width: 100vw;
  padding: 26px 30px;
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  grid-template-rows: 1fr 1fr;
  gap: 20px;
}

.card {
  background: rgba(35,40,37,.76);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 30px;
  padding: 24px 28px;
  box-shadow:
    0 18px 45px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter: blur(18px);
}

.leftTop {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.time {
  font-size: clamp(100px, 13vw, 170px);
  font-weight: 250;
  letter-spacing: -8px;
  line-height: .82;
  white-space: nowrap;
}

.date {
  margin-top: 18px;
  font-size: clamp(22px, 2.4vw, 34px);
  color: #b9c0bb;
  font-weight: 400;
}

.weatherRow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.weatherMain {
  display: flex;
  align-items: center;
  gap: 18px;
}

.weatherIcon {
  width: clamp(62px, 7vw, 92px);
  height: clamp(62px, 7vw, 92px);
  color: rgba(245,244,239,.92);
  flex: 0 0 auto;
}

.weatherIcon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.temp {
  font-size: clamp(46px, 5.5vw, 72px);
  font-weight: 300;
  line-height: 1;
}

.weatherDescription {
  font-size: 20px;
  color: #d7dbd8;
  margin-top: 5px;
}

.weatherDetails {
  text-align: right;
  color: #b8c0bb;
  font-size: 18px;
  line-height: 1.55;
}

.alert {
  display: none;
  margin-top: 14px;
  padding: 13px 17px;
  border-radius: 16px;
  background: linear-gradient(
    135deg,
    rgba(176, 82, 52, .96),
    rgba(123, 48, 37, .96)
  );
  border: 1px solid rgba(255,220,200,.24);
  color: #fff7f1;
  font-size: 17px;
  font-weight: 600;
  box-shadow: 0 8px 25px rgba(90,35,20,.3);
}

.camera {
  display: flex;
  flex-direction: column;
}

.cameraView {
  flex: 1;
  min-height: 0;
  border-radius: 22px;
  background: linear-gradient(145deg, #1a211e, #0b0e0d);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.alexaIcon {
  width: 58px;
  height: 58px;
  margin: 0 auto 12px;
  border: 2px solid rgba(245,244,239,.75);
  border-radius: 50%;
  position: relative;
}

.alexaIcon::after {
  content: "";
  position: absolute;
  width: 24px;
  height: 24px;
  border: 2px solid rgba(245,244,239,.55);
  border-radius: 50%;
  top: 15px;
  left: 15px;
}

.cameraTitle {
  font-size: 25px;
}

.cameraSub {
  margin-top: 8px;
  color: #89928d;
  font-size: 16px;
}

.temps {
  display: flex;
  flex-direction: column;
}

.tempRooms {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  flex: 1;
}

.room {
  background: rgba(255,255,255,.045);
  border-radius: 22px;
  padding: 22px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.roomName {
  color: #aab2ad;
  font-size: 18px;
}

.roomTemp {
  font-size: clamp(42px, 5vw, 65px);
  font-weight: 300;
  margin-top: 5px;
}

.quoteCard {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.label {
  text-transform: uppercase;
  letter-spacing: 2.4px;
  font-size: 13px;
  color: #89938d;
  font-weight: 600;
  margin-bottom: 16px;
}

.quoteMark {
  font-family: Georgia, serif;
  font-size: 60px;
  color: #7f9286;
  line-height: .6;
}

.quote {
  font-family: Georgia, serif;
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.25;
  color: #eceae3;
}

.author {
  margin-top: 14px;
  color: #929c96;
  font-size: 17px;
}

@media (max-width: 800px) {
  .dashboard {
    padding: 16px;
    gap: 13px;
  }

  .card {
    border-radius: 24px;
    padding: 20px;
  }
}
</style>
</head>

<body>

<div class="dashboard">

  <section class="card leftTop">

    <div>
      <div class="time" id="time">8:26</div>
      <div class="date" id="date">Monday, August 24</div>
    </div>

    <div>

      <div class="weatherRow">

        <div class="weatherMain">

          <div class="weatherIcon" id="weatherIcon"></div>

          <div>
            <div class="temp" id="temperature">--°</div>
            <div class="weatherDescription" id="conditions">
              Santa Clarita
            </div>
          </div>

        </div>

        <div class="weatherDetails">
          <div id="highLow">H --° &nbsp; L --°</div>
          <div id="wind">Wind --</div>
        </div>

      </div>

      <div class="alert" id="alert"></div>

    </div>

  </section>


  <section class="card camera">

    <div class="label">Alexa</div>

    <div class="cameraView">
      <div>
        <div class="alexaIcon"></div>
        <div class="cameraTitle">Alexa is ready</div>
        <div class="cameraSub">
          “Alexa, show me the Front Door”
        </div>
      </div>
    </div>

  </section>


  <section class="card temps">

    <div class="label">Inside</div>

    <div class="tempRooms">

      <div class="room">
        <div class="roomName">Downstairs</div>
        <div class="roomTemp" id="downstairs">--°</div>
      </div>

      <div class="room">
        <div class="roomName">Upstairs</div>
        <div class="roomTemp" id="upstairs">--°</div>
      </div>

    </div>

  </section>


  <section class="card quoteCard">

    <div class="label">Thought for Today</div>

    <div>
      <div class="quoteMark">“</div>
      <div class="quote" id="quote"></div>
      <div class="author" id="author"></div>
    </div>

  </section>

</div>


<script>

function updateClock() {
  const now = new Date();

  document.getElementById("time").textContent =
    now.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString([], {
      weekday: "long",
      month: "long",
      day: "numeric"
    });
}

updateClock();
setInterval(updateClock, 1000);


const quotes = [
  ["The best way out is always through.", "Robert Frost"],
  ["Nothing is worth more than this day.", "Johann Wolfgang von Goethe"],
  ["Wherever you go, go with all your heart.", "Confucius"],
  ["Act as if what you do makes a difference. It does.", "William James"],
  ["The creation of a thousand forests is in one acorn.", "Ralph Waldo Emerson"],
  ["Turn your wounds into wisdom.", "Oprah Winfrey"],
  ["Do what you can, with what you have, where you are.", "Theodore Roosevelt"],
  ["Forever is composed of nows.", "Emily Dickinson"]
];

const start = new Date(new Date().getFullYear(), 0, 0);
const diff = new Date() - start;
const day = Math.floor(diff / 86400000);

const todaysQuote = quotes[day % quotes.length];

document.getElementById("quote").textContent = todaysQuote[0];
document.getElementById("author").textContent = "— " + todaysQuote[1];


const latitude = 34.3917;
const longitude = -118.5426;


function svgWrap(content) {
  return `
    <svg viewBox="0 0 64 64"
         fill="none"
         stroke="currentColor"
         stroke-width="2.2"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">
      ${content}
    </svg>
  `;
}

function iconSunny() {
  return svgWrap(`
    <circle cx="32" cy="32" r="10"></circle>
    <path d="M32 8v8"></path>
    <path d="M32 48v8"></path>
    <path d="M8 32h8"></path>
    <path d="M48 32h8"></path>
    <path d="M15 15l6 6"></path>
    <path d="M43 43l6 6"></path>
    <path d="M49 15l-6 6"></path>
    <path d="M21 43l-6 6"></path>
  `);
}

function iconCloudy() {
  return svgWrap(`
    <path d="M18 43h27a9 9 0 0 0 0-18
             14 14 0 0 0-26-4
             10 10 0 0 0-1 22z"></path>
  `);
}

function iconPartlyCloudy() {
  return svgWrap(`
    <circle cx="24" cy="22" r="8"></circle>
    <path d="M24 6v5"></path>
    <path d="M24 33v5"></path>
    <path d="M8 22h5"></path>
    <path d="M35 22h5"></path>
    <path d="M13 11l4 4"></path>
    <path d="M31 29l4 4"></path>

    <path d="M19 46h28a8 8 0 0 0 0-16
             13 13 0 0 0-24-3
             9 9 0 0 0-4 19z"></path>
  `);
}

function iconRain() {
  return svgWrap(`
    <path d="M18 34h27a9 9 0 0 0 0-18
             14 14 0 0 0-26-4
             10 10 0 0 0-1 22z"></path>
    <path d="M24 42l-3 7"></path>
    <path d="M34 42l-3 7"></path>
    <path d="M44 42l-3 7"></path>
  `);
}

function iconStorm() {
  return svgWrap(`
    <path d="M18 32h27a9 9 0 0 0 0-18
             14 14 0 0 0-26-4
             10 10 0 0 0-1 22z"></path>
    <path d="M34 36l-6 11h7l-4 10 12-14h-7l4-7z"></path>
  `);
}

function iconFog() {
  return svgWrap(`
    <path d="M18 29h27a9 9 0 0 0 0-18
             14 14 0 0 0-26-4
             10 10 0 0 0-1 22z"></path>
    <path d="M12 38h40"></path>
    <path d="M16 45h32"></path>
    <path d="M21 52h22"></path>
  `);
}

function iconSnow() {
  return svgWrap(`
    <path d="M18 28h27a9 9 0 0 0 0-18
             14 14 0 0 0-26-4
             10 10 0 0 0-1 22z"></path>

    <path d="M24 39v14"></path>
    <path d="M18 42l12 8"></path>
    <path d="M30 42l-12 8"></path>

    <path d="M42 39v14"></path>
    <path d="M36 42l12 8"></path>
    <path d="M48 42l-12 8"></path>
  `);
}

function chooseWeatherIcon(description) {
  const text = description.toLowerCase();

  if (text.includes("thunder")) return iconStorm();

  if (
    text.includes("snow") ||
    text.includes("sleet") ||
    text.includes("ice")
  ) return iconSnow();

  if (
    text.includes("rain") ||
    text.includes("shower") ||
    text.includes("drizzle")
  ) return iconRain();

  if (
    text.includes("fog") ||
    text.includes("haze") ||
    text.includes("mist")
  ) return iconFog();

  if (
    text.includes("partly cloudy") ||
    text.includes("mostly sunny") ||
    text.includes("partly sunny")
  ) return iconPartlyCloudy();

  if (
    text.includes("cloud") ||
    text.includes("overcast")
  ) return iconCloudy();

  if (
    text.includes("sunny") ||
    text.includes("clear")
  ) return iconSunny();

  return iconPartlyCloudy();
}


async function loadWeather() {

  try {

    const point = await fetch(
      `https://api.weather.gov/points/${latitude},${longitude}`
    ).then(r => r.json());

    const forecast = await fetch(
      point.properties.forecastHourly
    ).then(r => r.json());

    const periods = forecast.properties.periods;
    const current = periods[0];

    document.getElementById("temperature").textContent =
      current.temperature + "°";

    document.getElementById("conditions").textContent =
      current.shortForecast;

    document.getElementById("weatherIcon").innerHTML =
      chooseWeatherIcon(current.shortForecast);

    document.getElementById("wind").textContent =
      "Wind " + current.windSpeed + " " + current.windDirection;


    const next24 = periods
      .slice(0, 24)
      .map(p => p.temperature);

    const high = Math.max(...next24);
    const low = Math.min(...next24);

    document.getElementById("highLow").textContent =
      `H ${high}°   L ${low}°`;


    const alertData = await fetch(
      `https://api.weather.gov/alerts/active?point=${latitude},${longitude}`
    ).then(r => r.json());

    const alertBox = document.getElementById("alert");

    if (alertData.features.length > 0) {

      const alert = alertData.features[0].properties;

      alertBox.style.display = "block";
      alertBox.textContent = "Weather Alert  •  " + alert.event;

    } else {

      alertBox.style.display = "none";
    }

  } catch(error) {

    document.getElementById("conditions").textContent =
      "Weather temporarily unavailable";

    document.getElementById("weatherIcon").innerHTML = "";
  }
}

loadWeather();
setInterval(loadWeather, 600000);

</script>

</body>
</html>
