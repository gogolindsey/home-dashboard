<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Home Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: #f5f9fc;

    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(22, 74, 116, 0.20),
            transparent 38%
        ),
        linear-gradient(
            155deg,
            #071a2d 0%,
            #041322 50%,
            #020c17 100%
        );
}

/* ================================
   MAIN DASHBOARD
================================ */

.dashboard {
    width: 100vw;
    height: 100vh;
    padding: 10px;

    display: grid;
    grid-template-rows:
        minmax(0, 2.15fr)
        minmax(0, 0.85fr);

    gap: 9px;
}

/* ================================
   CARDS
================================ */

.card {
    min-height: 0;

    background:
        linear-gradient(
            145deg,
            rgba(8, 31, 54, 0.98),
            rgba(3, 18, 33, 0.99)
        );

    border:
        1px solid rgba(92, 151, 198, 0.20);

    border-radius: 21px;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);

    overflow: hidden;
}

/* ================================
   CLOCK + WEATHER
================================ */

.mainCard {
    padding:
        clamp(13px, 2.3vh, 20px)
        clamp(18px, 3.7vw, 29px);

    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.topRow {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 22px;
}

/* CLOCK */

.time {
    font-size:
        clamp(58px, 12.5vw, 102px);

    line-height: 0.88;
    font-weight: 250;
    letter-spacing: -0.065em;
    color: #f5f9fc;
    white-space: nowrap;

    text-shadow:
        0 2px 18px rgba(100, 180, 235, 0.07);
}

/* DATE */

.date {
    margin-top: 8px;

    font-size:
        clamp(17px, 3.2vw, 25px);

    font-weight: 600;
    letter-spacing: -0.015em;
    color: #9dbbd2;
}

/* ================================
   CURRENT WEATHER
================================ */

.weather {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-width: 350px;
}

.weatherPrimary {
    display: flex;
    align-items: center;
    min-width: 0;
}

.weatherIcon {
    width:
        clamp(54px, 9vw, 77px);

    height:
        clamp(54px, 9vw, 77px);

    margin-right: 12px;
    flex-shrink: 0;
    color: #f4c84a;
}

.temperature {
    font-size:
        clamp(42px, 7vw, 64px);

    line-height: 0.92;
    font-weight: 350;
    letter-spacing: -0.05em;
    color: #f5f9fc;
}

.weatherDescription {
    margin-top: 4px;

    font-size:
        clamp(15px, 2.4vw, 20px);

    font-weight: 600;
    color: #d9e6ef;
}

.weatherDetails {
    margin-left: 15px;
    padding-left: 15px;

    border-left:
        1px solid rgba(89, 150, 198, 0.24);

    text-align: right;

    font-size:
        clamp(13px, 2.1vw, 18px);

    line-height: 1.45;
    font-weight: 600;
    color: #9dbbd2;
    white-space: nowrap;
}

.weatherDetails .high {
    color: #f1f6fa;
}

.weatherDetails .low {
    color: #29b9e1;
}

/* ================================
   NEXT 5 HOURS
================================ */

.forecastBlock {
    margin-top: 10px;
}

.forecastLabel {
    margin-bottom: 6px;

    font-size:
        clamp(10px, 1.8vw, 13px);

    font-weight: 750;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #47b8df;
}

.hourlyForecast {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
}

.hour {
    min-width: 0;
    padding: 7px 5px 6px;

    text-align: center;

    border:
        1px solid rgba(92, 151, 198, 0.14);

    border-radius: 11px;

    background:
        rgba(11, 42, 68, 0.52);
}

.hourTime {
    font-size:
        clamp(10px, 1.9vw, 13px);

    font-weight: 700;
    color: #9dbbd2;
}

.hourIcon {
    height: 22px;
    margin: 2px auto 1px;
    color: #f4c84a;
}

.hourTemp {
    font-size:
        clamp(15px, 2.8vw, 21px);

    line-height: 1;
    font-weight: 650;
    color: #f5f9fc;
}

.hourRain {
    margin-top: 2px;

    font-size:
        clamp(9px, 1.6vw, 11px);

    font-weight: 600;
    color: #69c5e5;
}

/* ================================
   5 DAY OUTLOOK
================================ */

.outlook {
    margin-top: 8px;

    padding:
        7px 10px;

    border-radius: 10px;

    background:
        rgba(15, 52, 80, 0.45);

    border:
        1px solid rgba(92, 151, 198, 0.12);

    font-size:
        clamp(11px, 1.9vw, 14px);

    line-height: 1.25;
    font-weight: 600;
    color: #b8cfdf;
}

.outlook strong {
    color: #eaf3f8;
}

/* ================================
   THOUGHT FOR TODAY
================================ */

.thoughtCard {
    padding:
        clamp(13px, 2vh, 19px)
        clamp(18px, 4vw, 30px);

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.label {
    font-size:
        clamp(11px, 2vw, 15px);

    font-weight: 750;
    letter-spacing: 0.18em;
    color: #47b8df;
    text-transform: uppercase;
}

.quoteMark {
    height: 20px;
    margin-top: 1px;

    font-family: Georgia, serif;
    font-size: 33px;
    line-height: 1;
    color: #2b91c7;
}

.quote {
    margin-top: 0;
    max-width: 98%;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(18px, 3.6vw, 28px);

    line-height: 1.10;
    font-weight: 600;
    letter-spacing: -0.025em;
    color: #edf4f8;
}

.quote.medium {
    font-size:
        clamp(16px, 3vw, 24px);
}

.quote.long {
    font-size:
        clamp(14px, 2.5vw, 20px);
}

.quote.veryLong {
    font-size:
        clamp(12px, 2vw, 17px);
}

.author {
    margin-top: 8px;

    font-size:
        clamp(11px, 2vw, 15px);

    font-weight: 600;
    color: #42b5dd;
}

/* ================================
   SMALL SCREEN ADJUSTMENTS
================================ */

@media (max-width: 760px) {
    .topRow {
        gap: 12px;
    }

    .weather {
        min-width: 310px;
    }

    .weatherDetails {
        margin-left: 10px;
        padding-left: 10px;
    }
}

@media (max-width: 610px) {
    .dashboard {
        padding: 7px;
        gap: 6px;
    }

    .mainCard {
        padding: 12px 14px;
    }

    .thoughtCard {
        padding: 11px 15px;
    }

    .weather {
        min-width: 270px;
    }

    .hourlyForecast {
        gap: 4px;
    }
}

/* ================================
   VERY SHORT SCREEN
================================ */

@media (max-height: 500px) {
    .dashboard {
        padding: 5px;
        gap: 5px;
    }

    .mainCard {
        padding: 9px 14px;
    }

    .time {
        font-size: clamp(50px, 11vw, 82px);
    }

    .date {
        margin-top: 4px;
    }

    .forecastBlock {
        margin-top: 5px;
    }

    .hour {
        padding-top: 4px;
        padding-bottom: 4px;
    }

    .hourIcon {
        height: 18px;
    }

    .outlook {
        margin-top: 5px;
        padding-top: 5px;
        padding-bottom: 5px;
    }

    .thoughtCard {
        padding: 8px 15px;
    }

    .author {
        margin-top: 4px;
    }
}
</style>
</head>

<div class="dashboard">

    <section class="card mainCard">

        <div class="topRow">

            </div>

</div>

<script src="quotes.js"></script>
<script>

/* ================================
   SETTINGS

   These coordinates are centered on
   Santa Clarita, California.

   You do not need an API key.
================================ */

const LATITUDE = 34.3917;
const LONGITUDE = -118.5426;
const TIME_ZONE = "America/Los_Angeles";

/* ================================
   CLOCK
================================ */

function updateClock() {

    const now = new Date();

    const time =
        now.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );

    const date =
        now.toLocaleDateString(
            [],
            {
                weekday: "long",
                month: "long",
                day: "numeric"
            }
        );

    document.getElementById("time").textContent = time;
    document.getElementById("date").textContent = date;
}

updateClock();
setInterval(updateClock, 1000);


/* ================================
   WEATHER ICONS
================================ */

const icons = {

    storm: `

            <polyline points="57,63 45,82 57,82 48,99"/>

};


/* ================================
   WEATHER CODE TRANSLATOR
================================ */

function weatherInfo(code) {

    if (code === 0) {
        return {
            label: "Clear",
            icon: "sunny",
            color: "#f4c84a"
        };
    }

    if (code === 1 || code === 2) {
        return {
            label: code === 1 ? "Mostly Sunny" : "Partly Cloudy",
            icon: "partlyCloudy",
            color: "#d8dce0"
        };
    }

    if (code === 3) {
        return {
            label: "Cloudy",
            icon: "cloudy",
            color: "#b7c9d7"
        };
    }

    if ([45, 48].includes(code)) {
        return {
            label: "Fog",
            icon: "cloudy",
            color: "#b7c9d7"
        };
    }

    if (
        [51, 53, 55, 56, 57, 61, 63, 65, 66, 67,
         80, 81, 82, 85, 86].includes(code)
    ) {
        return {
            label: "Rain",
            icon: "rain",
            color: "#9fc7df"
        };
    }

    if ([71, 73, 75, 77].includes(code)) {
        return {
            label: "Snow",
            icon: "cloudy",
            color: "#dcecf6"
        };
    }

    if ([95, 96, 99].includes(code)) {
        return {
            label: "Thunderstorms",
            icon: "storm",
            color: "#d6c4ff"
        };
    }

    return {
        label: "Mixed Conditions",
        icon: "partlyCloudy",
        color: "#d8dce0"
    };
}


function setWeatherIcon(element, code) {

    const info = weatherInfo(code);

    element.innerHTML = icons[info.icon];
    element.style.color = info.color;
}


/* ================================
   WIND DIRECTION
================================ */

function compassDirection(degrees) {

    const directions = [
        "N", "NNE", "NE", "ENE",
        "E", "ESE", "SE", "SSE",
        "S", "SSW", "SW", "WSW",
        "W", "WNW", "NW", "NNW"
    ];

    const index =
        Math.round(degrees / 22.5) % 16;

    return directions[index];
}


/* ================================
   NEXT 5 HOURS
================================ */

function renderHourlyForecast(data) {

    const container =
        document.getElementById("hourlyForecast");

    container.innerHTML = "";

    const currentHour =
        data.current.time.slice(0, 13) + ":00";

    let startIndex =
        data.hourly.time.findIndex(
            time => time >= currentHour
        );

    if (startIndex < 0) {
        startIndex = 0;
    }

    const count =
        Math.min(
            5,
            data.hourly.time.length - startIndex
        );

    for (let offset = 0; offset < count; offset++) {

        const index = startIndex + offset;

        const time =
            new Date(
                data.hourly.time[index]
            ).toLocaleTimeString(
                [],
                {
                    hour: "numeric"
                }
            );

        const temp =
            Math.round(
                data.hourly.temperature_2m[index]
            );

        const code =
            data.hourly.weather_code[index];

        const rain =
            data.hourly.precipitation_probability[index] ?? 0;

        const info =
            weatherInfo(code);

        const hour =
            document.createElement("div");

        hour.className = "hour";

        hour.innerHTML = `
            <div class="hourTime">${time}</div>

            <div
                class="hourIcon"
                style="color:${info.color}">
                ${icons[info.icon]}
            </div>

            <div class="hourTemp">
                ${temp}°
            </div>

            <div class="hourRain">
                ${rain > 0 ? rain + "% rain" : "Dry"}
            </div>
        `;

        container.appendChild(hour);
    }
}


/* ================================
   5 DAY OUTLOOK
================================ */

function dayName(dateString) {

    return new Date(
        dateString + "T12:00:00"
    ).toLocaleDateString(
        [],
        {
            weekday: "long"
        }
    );
}


function buildFiveDayOutlook(data) {

    const days = 5;

    const dates =
        data.daily.time.slice(0, days);

    const highs =
        data.daily.temperature_2m_max
            .slice(0, days)
            .map(Math.round);

    const lows =
        data.daily.temperature_2m_min
            .slice(0, days)
            .map(Math.round);

    const rain =
        data.daily.precipitation_probability_max
            .slice(0, days);

    const codes =
        data.daily.weather_code
            .slice(0, days);

    const firstHigh = highs[0];
    const lastHigh = highs[highs.length - 1];

    const maxHigh = Math.max(...highs);
    const minHigh = Math.min(...highs);

    const maxIndex = highs.indexOf(maxHigh);
    const minIndex = highs.indexOf(minHigh);

    let temperatureSentence = "";

    if (
        maxIndex > 0 &&
        maxIndex < days - 1 &&
        maxHigh - firstHigh >= 5 &&
        maxHigh - lastHigh >= 5
    ) {
        temperatureSentence =
            `Warming through ${dayName(dates[maxIndex])}, then cooling later in the period.`;
    }

    else if (
        minIndex > 0 &&
        minIndex < days - 1 &&
        firstHigh - minHigh >= 5 &&
        lastHigh - minHigh >= 5
    ) {
        temperatureSentence =
            `Cooling through ${dayName(dates[minIndex])}, then warming again.`;
    }

    else if (lastHigh - firstHigh >= 5) {
        temperatureSentence =
            "A warming trend is expected over the next 5 days.";
    }

    else if (firstHigh - lastHigh >= 5) {
        temperatureSentence =
            "A cooling trend is expected over the next 5 days.";
    }

    else if (maxHigh - minHigh <= 5) {
        temperatureSentence =
            "Temperatures should stay fairly steady over the next 5 days.";
    }

    else {
        temperatureSentence =
            "Temperatures will vary a bit over the next 5 days.";
    }


    const wetIndexes = [];

    for (let i = 0; i < days; i++) {

        const wetCode =
            [51, 53, 55, 56, 57, 61, 63, 65, 66, 67,
             80, 81, 82, 95, 96, 99]
            .includes(codes[i]);

        if (rain[i] >= 35 || wetCode) {
            wetIndexes.push(i);
        }
    }


    let precipitationSentence = "";

    if (wetIndexes.length === 0) {
        precipitationSentence =
            "No meaningful rain signal is showing right now.";
    }

    else if (wetIndexes.length === 1) {
        precipitationSentence =
            `The best chance of rain is around ${dayName(dates[wetIndexes[0]])}.`;
    }

    else {
        const firstWet =
            dayName(dates[wetIndexes[0]]);

        const lastWet =
            dayName(
                dates[
                    wetIndexes[
                        wetIndexes.length - 1
                    ]
                ]
            );

        precipitationSentence =
            firstWet === lastWet
                ? `Rain is possible around ${firstWet}.`
                : `Rain chances appear from ${firstWet} into ${lastWet}.`;
    }


    const rangeHigh =
        Math.max(...highs);

    const rangeLow =
        Math.min(...lows);

    return (
        temperatureSentence +
        " " +
        precipitationSentence +
        ` Forecast range: ${rangeLow}° to ${rangeHigh}°.`
    );
}


/* ================================
   WEATHER FETCH
   Open-Meteo
   No account or API key required.
================================ */

async function updateWeather() {

    const params =
        new URLSearchParams({
            latitude: LATITUDE,
            longitude: LONGITUDE,

            current:
                "temperature_2m,weather_code,wind_speed_10m,wind_direction_10m",

            hourly:
                "temperature_2m,weather_code,precipitation_probability",

            daily:
                "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",

            temperature_unit: "fahrenheit",
            wind_speed_unit: "mph",
            timezone: TIME_ZONE,
            forecast_days: "6"
        });

    const url =
        "https://api.open-meteo.com/v1/forecast?" +
        params.toString();

    try {

        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "Weather request failed"
            );
        }

        const data =
            await response.json();


        const currentInfo =
            weatherInfo(
                data.current.weather_code
            );

        document.getElementById(
            "temperature"
        ).textContent =
            Math.round(
                data.current.temperature_2m
            ) + "°";

        document.getElementById(
            "weatherDescription"
        ).textContent =
            currentInfo.label;

        setWeatherIcon(
            document.getElementById(
                "weatherIcon"
            ),
            data.current.weather_code
        );


        document.getElementById(
            "highTemp"
        ).textContent =
            Math.round(
                data.daily.temperature_2m_max[0]
            ) + "°";

        document.getElementById(
            "lowTemp"
        ).textContent =
            Math.round(
                data.daily.temperature_2m_min[0]
            ) + "°";


        const windSpeed =
            Math.round(
                data.current.wind_speed_10m
            );

        const windDirection =
            compassDirection(
                data.current.wind_direction_10m
            );

        document.getElementById(
            "wind"
        ).textContent =
            `Wind ${windSpeed} mph ${windDirection}`;


        renderHourlyForecast(data);


        document.getElementById(
            "outlook"
        ).innerHTML =
            "<strong>5 Day Outlook:</strong> " +
            buildFiveDayOutlook(data);

    }

    catch (error) {

        console.error(
            "Weather error:",
            error
        );

        document.getElementById(
            "weatherDescription"
        ).textContent =
            "Weather unavailable";

        document.getElementById(
            "outlook"
        ).innerHTML =
            "<strong>5 Day Outlook:</strong> Unable to refresh weather right now.";
    }
}


updateWeather();

/* Refresh weather every 15 minutes. */
setInterval(
    updateWeather,
    15 * 60 * 1000
);

   page, so the quote does not depend
   on another website staying online.

/* ================================
   DAILY QUOTE SELECTOR

   Uses a fixed non-leap calendar so
   each month/day always gets the same
   quote. On Feb 29, the Feb 28 quote
   is shown.
================================ */

function quoteIndexForToday() {

    const now =
        new Date();

    let month =
        now.getMonth();

    let day =
        now.getDate();

    if (
        month === 1 &&
        day === 29
    ) {
        day = 28;
    }

    const fixedYear =
        2025;

    const start =
        Date.UTC(
            fixedYear,
            0,
            1
        );

    const current =
        Date.UTC(
            fixedYear,
            month,
            day
        );

    return Math.floor(
        (current - start) / 86400000
    );
}


function updateQuote() {

    const index =
        quoteIndexForToday();

    const item =
        QUOTES[index] ||
        QUOTES[0];

    const quoteElement =
        document.getElementById("quote");

    quoteElement.textContent =
        item.quote;

    document.getElementById(
        "author"
    ).textContent =
        item.author
            ? "— " + item.author
            : "";


    quoteElement.classList.remove(
        "medium",
        "long",
        "veryLong"
    );

    const length =
        item.quote.length;

    if (length > 340) {
        quoteElement.classList.add(
            "veryLong"
        );
    }

    else if (length > 235) {
        quoteElement.classList.add(
            "long"
        );
    }

    else if (length > 145) {
        quoteElement.classList.add(
            "medium"
        );
    }
}


updateQuote();

/* Re-check once a minute so the quote
   automatically changes after midnight. */
setInterval(
    updateQuote,
    60 * 1000
);
