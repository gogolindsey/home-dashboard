<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Dashboard</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "Segoe UI", sans-serif;
  color: #f7fbff;
  background:
    radial-gradient(circle at 18% 6%, rgba(0, 122, 255, .16), transparent 34%),
    radial-gradient(circle at 82% 100%, rgba(0, 210, 255, .06), transparent 34%),
    #031426;
}

.dashboard {
  width: 100vw;
  height: 100vh;
  padding: 14px;
  display: grid;
  grid-template-rows: 2fr 1fr;
  gap: 12px;
}

.card {
  background:
    linear-gradient(
      145deg,
      rgba(7, 39, 72, .96),
      rgba(3, 22, 42, .98)
    );
  border: 1px solid rgba(52, 164, 255, .22);
  border-radius: 24px;
  box-shadow:
    0 14px 34px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.04);
}

/* TOP */

.topCard {
  padding: 22px 24px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.time {
  font-size: clamp(112px, 20vw, 176px);
  font-weight: 220;
  letter-spacing: -8px;
  line-height: .82;
  white-space: nowrap;
  color: #f8fbff;
}

.date {
  margin-top: 20px;
  font-size: clamp(23px, 3.2vw, 32px);
  color: #9ed2ff;
  font-weight: 400;
}

.weatherArea {
  margin-top: 22px;
}

.weatherRow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.weatherMain {
  display: flex;
  align-items: center;
  gap: 18px;
}

.weatherIcon {
  width: clamp(74px, 12vw, 104px);
  height: clamp(74px, 12vw, 104px);
  color: #ffd54a;
  flex: 0 0 auto;
}

.weatherIcon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.temp {
  font-size: clamp(62px, 10vw, 90px);
  font-weight: 280;
  line-height: .95;
  color: #ffffff;
}

.weatherDescription {
  font-size: clamp(19px, 3vw, 25px);
  color: #eef7ff;
  margin-top: 6px;
}

.weatherDetails {
  text-align: right;
  color: #9ed2ff;
  font-size: clamp(17px, 2.6vw, 21px);
  line-height: 1.65;
  padding-left: 18px;
  border-left: 1px solid rgba(52,164,255,.28);
}

.weatherDetails strong {
  color: #ffffff;
}

.weatherDetails .low {
  color: #18d9ff;
}

/* ALERT */

.alert {
  display: none;
  margin-top: 18px;
  padding: 14px 18px;
  border-radius: 16px;
  background:
    linear-gradient(
      135deg,
      rgba(70, 16, 45, .98),
      rgba(39, 12, 35, .98)
    );
  border: 1px solid rgba(255, 87, 155, .78);
  color: #ff78ad;
  font-size: clamp(16px, 2.5vw, 19px);
  font-weight: 700;
  box-shadow:
    0 0 0 1px rgba(255, 87, 155, .05),
    0 8px 24px rgba(0,0,0,.2);
}

/* QUOTE */

.quoteCard {
  padding: 22px 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.label {
  text-transform: uppercase;
  letter-spacing: 3px;
  font-size: 13px;
  color: #42c7ff;
  font-weight: 700;
}

.quoteMark {
  font-family: Georgia, serif;
  font-size: 60px;
  color: #2ba8ff;
  line-height: .65;
  margin-top: 8px;
}

.quote {
  font-family: Georgia, serif;
  font-size: clamp(25px, 4.2vw, 36px);
  line-height: 1.16;
  color: #f8fbff;
  margin-top: 4px;
}

.author {
  margin-top: 14px;
  color: #4cc5ff;
  font-size: clamp(15px, 2.4vw, 19px);
}

@media (max-width: 700px) {
  .dashboard {
    padding: 12px;
    gap: 10px;
  }

  .topCard,
  .quoteCard {
    padding: 18px;
  }

  .card {
    border-radius: 21px;
  }

  .weatherRow {
    align-items: flex-end;
  }
}
</style>
</head>

<body>

<div class="dashboard">

  <section class="card topCard">

    <div>
      <div class="time" id="time">11:28 AM</div>
      <div class="date" id="date">Monday, August 24</div>
    </div>

    <div class="weatherArea">

      <div class="weatherRow">

        <div class="weatherMain">

          <div class="weatherIcon" id="weatherIcon"></div>

          <div>
            <div class="temp" id="temperature">--°</div>
            <div class="weatherDescription" id="conditions">
              Santa Clarita
            </div>
          </div>

        </div>

        <div class="weatherDetails">
          <div id="highLow">H --° &nbsp; L --°</div>
          <div id="wind">Wind --</div>
        </div>

      </div>

      <div class="alert" id="alert"></div>

    </div>

  </section>

  <section class="card quoteCard">

    <div class="label">Thought for Today</div>

    <div>
      <div class="quoteMark">“</div>
      <div class="quote" id="quote"></div>
      <div class="author" id="author"></div>
    </div>

  </section>

</div>

<script>

/* CLOCK */

function updateClock() {
  const now = new Date();

  document.getElementById("time").textContent =
    now.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString([], {
      weekday: "long",
      month: "long",
      day: "numeric"
    });
}

updateClock();
setInterval(updateClock, 1000);


/* QUOTES */

const quotes = [
  ["The best way out is always through.", "Robert Frost"],
  ["Nothing is worth more than this day.", "Johann Wolfgang von Goethe"],
  ["Wherever you go, go with all your heart.", "Confucius"],
  ["Act as if what you do makes a difference. It does.", "William James"],
  ["The creation of a thousand forests is in one acorn.", "Ralph Waldo Emerson"],
  ["Turn your wounds into wisdom.", "Oprah Winfrey"],
  ["Do what you can, with what you have, where you are.", "Theodore Roosevelt"],
  ["Forever is composed of nows.", "Emily Dickinson"]
];

const start = new Date(new Date().getFullYear(), 0, 0);
const diff = new Date() - start;
const day = Math.floor(diff / 86400000);

const todaysQuote = quotes[day % quotes.length];

document.getElementById("quote").textContent = todaysQuote[0];
document.getElementById("author").textContent = "— " + todaysQuote[1];


/* WEATHER */

const latitude = 34.3917;
const longitude = -118.5426;

function svgWrap(content) {
  return `
    <svg viewBox="0 0 64 64"
         fill="none"
         stroke="currentColor"
         stroke-width="2.2"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">
      ${content}
    </svg>
  `;
}

function iconSunny() {
  return svgWrap(`
    <circle cx="32" cy="32" r="10"></circle>
    <path d="M32 8v8"></path>
    <path d="M32 48v8"></path>
    <path d="M8 32h8"></path>
    <path d="M48 32h8"></path>
    <path d="M15 15l6 6"></path>
    <path d="M43 43l6 6"></path>
    <path d="M49 15l-6 6"></path>
    <path d="M21 43l-6 6"></path>
  `);
}

function iconCloudy() {
  return svgWrap(`
    <path d="M18 43h27a9 9 0 0 0 0-18
             14 14 0 0 0-26-4
             10 10 0 0 0-1 22z"></path>
  `);
}

function iconPartlyCloudy() {
  return svgWrap(`
    <circle cx="24" cy="22" r="8"></circle>
    <path d="M24 6v5"></path>
    <path d="M24 33v5"></path>
    <path d="M8 22h5"></path>
    <path d="M35 22h5"></path>
    <path d="M13 11l4 4"></path>
    <path d="M31 29l4 4"></path>

    <path d="M19 46h28a8 8 0 0 0 0-16
             13 13 0 0 0-24-3
             9 9 0 0 0-4 19z"></path>
  `);
}

function iconRain() {
  return svgWrap(`
    <path d="M18 34h27a9 9 0 0 0 0-18
             14 14 0 0 0-26-4
             10 10 0 0 0-1 22z"></path>
    <path d="M24 42l-3 7"></path>
    <path d="M34 42l-3 7"></path>
    <path d="M44 42l-3 7"></path>
  `);
}

function iconStorm() {
  return svgWrap(`
    <path d="M18 32h27a9 9 0 0 0 0-18
             14 14 0 0 0-26-4
             10 10 0 0 0-1 22z"></path>
    <path d="M34 36l-6 11h7l-4 10 12-14h-7l4-7z"></path>
  `);
}

function iconFog() {
  return svgWrap(`
    <path d="M18 29h27a9 9 0 0 0 0-18
             14 14 0 0 0-26-4
             10 10 0 0 0-1 22z"></path>
    <path d="M12 38h40"></path>
    <path d="M16 45h32"></path>
    <path d="M21 52h22"></path>
  `);
}

function iconSnow() {
  return svgWrap(`
    <path d="M18 28h27a9 9 0 0 0 0-18
             14 14 0 0 0-26-4
             10 10 0 0 0-1 22z"></path>
    <path d="M24 39v14"></path>
    <path d="M18 42l12 8"></path>
    <path d="M30 42l-12 8"></path>
    <path d="M42 39v14"></path>
    <path d="M36 42l12 8"></path>
    <path d="M48 42l-12 8"></path>
  `);
}

function chooseWeatherIcon(description) {
  const text = description.toLowerCase();

  if (text.includes("thunder")) return iconStorm();

  if (
    text.includes("snow") ||
    text.includes("sleet") ||
    text.includes("ice")
  ) return iconSnow();

  if (
    text.includes("rain") ||
    text.includes("shower") ||
    text.includes("drizzle")
  ) return iconRain();

  if (
    text.includes("fog") ||
    text.includes("haze") ||
    text.includes("mist")
  ) return iconFog();

  if (
    text.includes("partly cloudy") ||
    text.includes("mostly sunny") ||
    text.includes("partly sunny")
  ) return iconPartlyCloudy();

  if (
    text.includes("cloud") ||
    text.includes("overcast")
  ) return iconCloudy();

  if (
    text.includes("sunny") ||
    text.includes("clear")
  ) return iconSunny();

  return iconPartlyCloudy();
}


async function loadWeather() {

  try {

    const point = await fetch(
      `https://api.weather.gov/points/${latitude},${longitude}`
    ).then(r => r.json());

    const forecast = await fetch(
      point.properties.forecastHourly
    ).then(r => r.json());

    const periods = forecast.properties.periods;
    const current = periods[0];

    document.getElementById("temperature").textContent =
      current.temperature + "°";

    document.getElementById("conditions").textContent =
      current.shortForecast;

    document.getElementById("weatherIcon").innerHTML =
      chooseWeatherIcon(current.shortForecast);

    document.getElementById("wind").textContent =
      "Wind " + current.windSpeed + " " + current.windDirection;

    const next24 = periods
      .slice(0, 24)
      .map(p => p.temperature);

    const high = Math.max(...next24);
    const low = Math.min(...next24);

    document.getElementById("highLow").innerHTML =
      `<strong>H ${high}°</strong> &nbsp; <span class="low">L ${low}°</span>`;

    const alertData = await fetch(
      `https://api.weather.gov/alerts/active?point=${latitude},${longitude}`
    ).then(r => r.json());

    const alertBox = document.getElementById("alert");

    if (alertData.features.length > 0) {
      const alert = alertData.features[0].properties;

      alertBox.style.display = "block";
      alertBox.textContent = "⚠  Weather Alert • " + alert.event;

    } else {
      alertBox.style.display = "none";
    }

  } catch(error) {

    document.getElementById("conditions").textContent =
      "Weather temporarily unavailable";

    document.getElementById("weatherIcon").innerHTML = "";
  }
}

loadWeather();
setInterval(loadWeather, 600000);

</script>

</body>
</html>
